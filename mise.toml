[tools]
go = "1.25.7"
node = "latest"

[tasks.recheck-update]
description = "Update recheck to the latest version"
run = "npm update recheck"

[tasks.recheck-version]
description = "Check installed recheck version"
run = "npm list recheck"

[tasks.build]
description = "Build gorecheck"
run = "bash scripts/build.sh"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.clean]
description = "Clear build artifacts"
run = "rm -rf gorecheck gorecheck-linux-amd64"